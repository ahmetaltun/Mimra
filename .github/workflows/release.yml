name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Release Version Consistency
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TARGET_VERSION="${RAW_TAG#v}"
          
          INFO_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Mimra/Info.plist)
          INFO_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Mimra/Info.plist)
          CARGO_VERSION=$(grep '^version = ' RustCore/Cargo.toml | head -n1 | cut -d'"' -f2)
          
          echo "=== Release Tag: $RAW_TAG ==="
          echo "Target Version:     $TARGET_VERSION"
          echo "Info.plist Version: $INFO_VERSION (Build $INFO_BUILD)"
          echo "Cargo.toml Version: $CARGO_VERSION"
          
          if [ "$INFO_VERSION" != "$TARGET_VERSION" ]; then
            echo "::error::Version mismatch! Release tag is '$RAW_TAG' (expected $TARGET_VERSION), but Mimra/Info.plist has '$INFO_VERSION'. Ensure the version bump is committed to master before tagging!" >&2
            exit 1
          fi
          
          if [ "$CARGO_VERSION" != "$TARGET_VERSION" ]; then
            echo "::error::Version mismatch! Release tag is '$RAW_TAG' (expected $TARGET_VERSION), but RustCore/Cargo.toml has '$CARGO_VERSION'!" >&2
            exit 1
          fi
          echo "✓ All project version declarations match release tag $TARGET_VERSION"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Packaging Dependencies
        run: |
          brew install create-dmg

      - name: Setup Apple Developer ID Keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Cleanly strip whitespace/newlines and decode base64
          echo "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode -o "$RUNNER_TEMP/certificate.p12"

          # Attempt 1: Direct import with explicit PKCS12 format and access flags
          if ! security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -t cert \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security 2>/dev/null; then

            echo "Direct import failed. Converting PKCS#12 to Apple-compatible legacy encryption format..."
            openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" \
              -passin "pass:$APPLE_CERTIFICATE_PASSWORD" \
              -nodes \
              -out "$RUNNER_TEMP/temp.pem"

            openssl pkcs12 -export \
              -in "$RUNNER_TEMP/temp.pem" \
              -passout "pass:$APPLE_CERTIFICATE_PASSWORD" \
              -out "$RUNNER_TEMP/legacy.p12" \
              -legacy

            rm -f "$RUNNER_TEMP/temp.pem"

            security import "$RUNNER_TEMP/legacy.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -f pkcs12 \
              -t cert \
              -A \
              -T /usr/bin/codesign \
              -T /usr/bin/security
            rm -f "$RUNNER_TEMP/legacy.p12"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[ \t]*//' | tr -d '"')

      - name: Build Application (Release arm64)
        run: |
          ./scripts/build-app.sh release

      - name: Code Sign Application (Hardened Runtime)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "Signing Sparkle embedded components with identity: $SIGNING_IDENTITY"
          SPARKLE_DIR="build/Mimra.app/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_DIR" ]; then
            for xpc in "$SPARKLE_DIR"/Versions/B/XPCServices/*.xpc; do
              if [ -d "$xpc" ]; then
                codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp "$xpc"
              fi
            done
            for tool in "$SPARKLE_DIR"/Versions/B/Autoupdate "$SPARKLE_DIR"/Versions/B/Updater.app; do
              if [ -e "$tool" ]; then
                codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp "$tool"
              fi
            done
            codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp "$SPARKLE_DIR"
          fi
          echo "Signing Mimra.app with identity: $SIGNING_IDENTITY"
          codesign --force --options runtime --deep --sign "$SIGNING_IDENTITY" --timestamp build/Mimra.app
          codesign --verify --deep --strict --verbose=2 build/Mimra.app

      - name: Package Premium macOS DMG
        run: |
          ./scripts/build-dmg.sh build/Mimra.app dist/Mimra.dmg

      - name: Code Sign DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp dist/Mimra.dmg

      - name: Notarize DMG with Apple Notary Service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Submitting dist/Mimra.dmg to Apple Notary Service..."
          xcrun notarytool submit dist/Mimra.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple Notarization Ticket
        run: |
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple dist/Mimra.dmg
          xcrun stapler validate dist/Mimra.dmg
          spctl --assess --type open --context context:primary-signature dist/Mimra.dmg

      - name: Verify DMG Artifact Integrity
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Mimra.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" build/Mimra.app/Contents/Info.plist)
          python3 scripts/verify-dmg.py dist/Mimra.dmg --expected-version "$VERSION" --expected-build "$BUILD"

      - name: Compute Checksums
        run: |
          cd dist
          shasum -a 256 Mimra.dmg > Mimra.dmg.sha256
          cat Mimra.dmg.sha256
          cd ..

      - name: Sign DMG & Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Mimra.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" build/Mimra.app/Contents/Info.plist)
          echo "Generating Sparkle Appcast for Mimra v$VERSION (Build $BUILD)..."
          ./scripts/generate-appcast.sh dist/Mimra.dmg "$VERSION" "$BUILD" "$SPARKLE_PRIVATE_KEY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Mimra.dmg
            dist/Mimra.dmg.sha256
            appcast.xml
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}

      - name: Commit Updated Appcast to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Preserve newly generated appcast.xml across checkout
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          
          # Discard intermediate build artifacts so working directory is clean
          git reset --hard HEAD
          git clean -fd
          
          # Switch to master branch to avoid detached HEAD refspec errors
          git fetch origin master
          git checkout master
          git pull origin master
          
          # Restore updated appcast.xml and push
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git add appcast.xml
          
          if ! git diff --cached --quiet; then
            RELEASE_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
            git commit -m "chore(release): update appcast.xml for $RELEASE_TAG [skip ci]"
            git push origin master
            echo "✓ Successfully committed and pushed updated appcast.xml to master branch"
          else
            echo "No changes in appcast.xml to commit"
          fi

      - name: Cleanup Ephemeral Keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
