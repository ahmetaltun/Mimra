[package]
name = "mimra-core"
version = "0.1.0"
edition = "2021"
authors = ["Mimra Core Contributors"]
license = "MIT"
description = "High-performance, privacy-first local storage and search core for Mimra"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "mimra_core"

[dependencies]
# UniFFI for Swift/Rust bridging
uniffi = { version = "0.28", features = ["cli"] }

# Error handling
thiserror = "2.0"

# Cryptographic hashing for deduplication
blake3 = "1.5"

# Identifiers and serialization
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }

# SQLite with bundled build and FTS5 enabled
rusqlite = { version = "0.33", features = ["bundled", "bundled-full"] }

# Safe regex search engine
regex = "1.11"

# Unicode normalization for search
unicode-normalization = "0.1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3.17"
serde_json = "1.0"

[profile.dev.package."*"]
opt-level = 3
